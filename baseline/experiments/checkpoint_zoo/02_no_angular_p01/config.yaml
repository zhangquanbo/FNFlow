experiment:
  id: "02_no_angular_p01"
  description: "L_flow加L_unit，不使用L_ang"

checkpoint:
  local_path: "checkpoint.pth"
  source_project: "${WORKSPACE_ROOT}/FaceFlux-Clean"
  source_path: "experiments/fig2/output/wo_ang/latest.pth"
  sha256: "46d2b79addb4672efc3dbd12c4142d0103e58a533301b9f051bcf21b3cbde9b7"
  epoch: 500
  epoch_evidence: "epoch_500 filename or completed-run latest checkpoint"

provenance:
  original_training_entry: "experiments/fig2/train_a.sh"
  confidence: "high"
  note: "Checkpoint仅保存state_dict；旧实验的完整CLI参数没有写入checkpoint。"

model:
  architecture: "FaceNormalUNet_B"
  model_size: "B"
  training_code: "training_code/train_unet.py"
  model_code: "training_code/src/models/model_unet.py"
  training_code_sha256: "8e0ec4545dc353850281f558322b2ea3e05aa7649660355b50d22d3c481ccca0"
  model_code_sha256: "be005d556b3a679c2141fe9e5510c0a5e9d53d962c0eff89aff10f6bad04ddb3"

dataset:
  rgb_dir: "${FACEFLUX_BEST_ROOT}/datasets/ffhq_rgb_crop256"
  normal_dir: "${FACEFLUX_BEST_ROOT}/datasets/ffhq_rgb_crop256N"
  training_eval_images: "${FACEFLUX_BEST_ROOT}/data/test_images_1/imgs"

training:
  method: "flow_matching"
  loss: "l2_norm"
  weight_cos: 0.25
  drop_prob: 0.1
  image_size: 256
  batch_size: 8
  grad_accum_steps: 2
  effective_batch_size: 16
  learning_rate: 1.0e-4
  optimizer: "AdamW"
  epochs: 500
  start_save_epoch: 200
  save_interval: 10
  eval_steps: 20
  mixed_precision: "fp16"
  seed: 1247
  seed_source: "fixed_inside_training_code"

retraining:
  command: "bash train.sh"
  output_dir: "retrained"
  final_checkpoint: "retrained/epoch_500.pth"
  legacy_rng_compatibility: true
  note: "保留训练期evaluate调用以维持旧训练的CUDA随机数轨迹；训练成功后自动删除评估图片和中间checkpoint。"
